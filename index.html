<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Baloo+Thambi+2:wght@400..800&family=Diplomata&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Michroma&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Mulish:ital,wght@0,200..1000;1,200..1000&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Oswald:wght@200..700&family=Outfit:wght@100..900&family=WindSong:wght@400;500&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crazy 3D image slider</title>
</head>
<body>
    <div class="banner">
        <div class="slider" style="--quantity: 9">
            <div class="item" style="--position: 1">
                <img src="Pictures/image1.jpg" alt="">
            </div>
            <div class="item">
                <img src="Pictures/cute2.png" alt="">
            </div>
            <div class="item" style="--position: 2">
                <img src="Pictures/image2.jpg" alt="">
            </div>
            <div class="item" style="--position: 3">
                <img src="Pictures/image3.jpg" alt="">
            </div>
            <div class="item" style="--position: 4">
                <img src="Pictures/image4.jpg" alt="">
            </div>
            <div class="item" style="--position: 5">
                <img src="Pictures/image5.jpg" alt="">
            </div>
            <div class="item" style="--position: 6">
                <img src="Pictures/image6.jpg" alt="">
            </div>
            <div class="item" style="--position: 7">
                <img src="Pictures/image7.jpg" alt="">
            </div>
            <div class="item" style="--position: 8">
                <img src="Pictures/image8.jpg" alt="">
            </div>
            <div class="item" style="--position: 9">
                <img src="Pictures/image9.jpg" alt="">
            </div>
            
        </div>
    </div>
    <div class="right">
        <div class="title">
            Zootopia
        </div>
        <div class="description">
            Zootopia (2016) là một bộ phim hoạt hình 3D của Disney<br>
            thuộc thể loại hài hước – phiêu lưu – trinh thám, lấy bối cảnh<br>
            trong một thành phố hiện đại nơi động vật sống như con người.
        </div>
        <div class="button">Xem ngay</div>
    <script src="script.js"></script>
</body>
</html>
